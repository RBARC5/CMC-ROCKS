<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMC Rocks Crew</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rust:   #F54217;
    --gold:   #F39F34;
    --olive:  #9D9812;
    --cobalt: #0048FF;
    --cream:  #F4E9D3;
    --smoke:  #16140E;
    --char:   #22221F;
    --dust:   #A08850;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--char);
    color: var(--cream);
    font-family: 'Barlow', sans-serif;
  }

  #stars {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1px 1px at 8%  10%, rgba(244,233,211,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 18% 5%,  rgba(244,233,211,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 32% 14%, rgba(244,233,211,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 6%,  rgba(244,233,211,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 18%, rgba(244,233,211,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 68% 8%,  rgba(244,233,211,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 22%, rgba(244,233,211,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 11%, rgba(244,233,211,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 4%,  rgba(244,233,211,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 12% 28%, rgba(244,233,211,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 72% 32%, rgba(244,233,211,0.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 40% 9%,  rgba(243,159,52,0.55) 0%, transparent 100%),
      radial-gradient(2px 2px at 62% 3%,  rgba(243,159,52,0.4)  0%, transparent 100%),
      radial-gradient(2px 2px at 85% 17%, rgba(243,159,52,0.5)  0%, transparent 100%),
      radial-gradient(2px 2px at 22% 18%, rgba(245,66,23,0.35)  0%, transparent 100%);
  }

  #horizon {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(
      to top,
      var(--char)              0%,
      #2A1608                  16%,
      rgba(60,28,10,0.65)      32%,
      rgba(157,152,18,0.07)    50%,
      transparent              66%
    );
  }

  #spotlight {
    position: fixed;
    top: -20%; left: 50%; transform: translateX(-50%);
    width: 700px; height: 700px;
    background: radial-gradient(ellipse at 50% 0%,
      rgba(245,66,23,0.12)  0%,
      rgba(243,159,52,0.06) 30%,
      transparent           65%
    );
    z-index: 2;
    animation: sway 8s ease-in-out infinite;
  }

  @keyframes sway {
    0%,100% { transform: translateX(-50%) rotate(-4deg); }
    50%      { transform: translateX(-50%) rotate(4deg); }
  }

  #glow {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 700px; height: 320px;
    background: radial-gradient(ellipse at 50% 100%,
      rgba(245,66,23,0.5)   0%,
      rgba(243,159,52,0.28) 30%,
      rgba(157,152,18,0.06) 55%,
      transparent           72%
    );
    z-index: 2;
    animation: flicker 3.2s ease-in-out infinite;
  }

  @keyframes flicker {
    0%,100% { opacity: 1;    transform: translateX(-50%) scaleX(1);    }
    30%      { opacity: 0.84; transform: translateX(-50%) scaleX(1.05); }
    65%      { opacity: 0.94; transform: translateX(-50%) scaleX(0.96); }
  }

  #silhouette {
    position: fixed;
    bottom: 0; right: 7%;
    width: 175px; height: 330px;
    z-index: 3;
    opacity: 0.15;
    filter: drop-shadow(0 0 30px rgba(245,66,23,0.25));
  }

  /* CMC-style animated top stripe */
  #stripe-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg,
      var(--rust) 0%,
      var(--gold) 33%,
      var(--olive) 55%,
      var(--cobalt) 75%,
      var(--rust) 100%
    );
    background-size: 300% 100%;
    z-index: 50;
    animation: stripe 5s linear infinite;
  }

  @keyframes stripe {
    0%   { background-position: 0% 0%; }
    100% { background-position: 300% 0%; }
  }

  #stage {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: clamp(0.58rem, 1.3vw, 0.75rem);
    letter-spacing: 0.52em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: rise 0.8s ease forwards 0.2s;
  }

  .badge-strip {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.75rem 0 0.3rem;
    opacity: 0;
    animation: rise 0.8s ease forwards 0.5s;
  }

  .badge-pill {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    padding: 0.2rem 0.7rem 0.15rem;
    border-radius: 2px;
  }

  .pill-orange { background: var(--rust);   color: #fff; }
  .pill-olive  { background: var(--olive);  color: #fff; }
  .pill-blue   { background: var(--cobalt); color: #fff; }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 14vw, 11rem);
    letter-spacing: 0.06em;
    line-height: 0.86;
    color: var(--cream);
    text-shadow:
      0 0 100px rgba(245,66,23,0.45),
      0 0 30px  rgba(243,159,52,0.2);
    opacity: 0;
    animation: rise 1s ease forwards 0.7s;
  }

  .title-crew {
    display: block;
    color: var(--rust);
    font-size: clamp(3.2rem, 9.5vw, 7.5rem);
    text-shadow:
      0 0 60px rgba(245,66,23,0.6),
      3px 3px 0 rgba(0,0,0,0.4);
  }

  .title-qld {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.1rem, 2.8vw, 2.2rem);
    -webkit-text-stroke: 1.5px var(--gold);
    color: transparent;
    letter-spacing: 0.42em;
    text-shadow: none;
    margin-top: 0.2em;
    opacity: 0;
    animation: rise 0.8s ease forwards 1s;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin: 1.3rem auto;
    opacity: 0;
    animation: rise 0.8s ease forwards 1.1s;
  }

  .divider-line {
    width: 80px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider-line.rev { background: linear-gradient(to left, transparent, var(--gold)); }

  .divider-icon { font-size: 1rem; color: var(--rust); }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(0.82rem, 2vw, 1.15rem);
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--dust);
    opacity: 0;
    animation: rise 0.8s ease forwards 1.3s;
  }

  .construction-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 2rem;
    padding: 0.5rem 1.4rem;
    border: 1px solid rgba(245,66,23,0.4);
    border-radius: 2px;
    background: rgba(22,20,14,0.7);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.73rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--rust);
    opacity: 0;
    animation: rise 0.8s ease forwards 1.6s;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rust);
    flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.3; transform: scale(0.6); }
  }

  .sub {
    margin-top: 0.85rem;
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: clamp(0.7rem, 1.5vw, 0.83rem);
    color: rgba(160,136,80,0.6);
    letter-spacing: 0.06em;
    opacity: 0;
    animation: rise 0.8s ease forwards 1.9s;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #fence {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 70px; z-index: 5;
  }

  @media (max-width: 520px) {
    #silhouette { display: none; }
    #glow { width: 100%; }
    .badge-strip { display: none; }
  }
</style>
</head>
<body>

<div id="stripe-top"></div>
<div id="stars"></div>
<div id="horizon"></div>
<div id="spotlight"></div>
<div id="glow"></div>

<svg id="silhouette" viewBox="0 0 180 340" xmlns="http://www.w3.org/2000/svg">
  <path d="M90 20 L94 18 L97 20 L98 30 L98 62 L104 82
    C132 87 150 113 150 143 C150 158 142 172 130 178
    C142 188 150 208 150 228 C150 275 122 312 90 312
    C58 312 30 275 30 228 C30 208 38 188 50 178
    C38 172 30 158 30 143 C30 113 48 87 76 82
    L82 62 L82 30 Z" fill="var(--cream)"/>
  <circle cx="90" cy="202" r="24" fill="var(--char)"/>
  <circle cx="90" cy="202" r="14" fill="none" stroke="var(--cream)" stroke-width="1" opacity="0.2"/>
  <line x1="90" y1="72" x2="90" y2="294" stroke="var(--char)" stroke-width="1"   opacity="0.5"/>
  <line x1="86" y1="72" x2="84" y2="294" stroke="var(--char)" stroke-width="0.7" opacity="0.35"/>
  <line x1="94" y1="72" x2="96" y2="294" stroke="var(--char)" stroke-width="0.7" opacity="0.35"/>
  <rect x="83" y="6"  width="14" height="24" rx="3" fill="var(--cream)"/>
  <rect x="78" y="125" width="24" height="5" rx="1" fill="var(--char)" opacity="0.3"/>
  <rect x="78" y="145" width="24" height="5" rx="1" fill="var(--char)" opacity="0.3"/>
  <rect x="78" y="165" width="24" height="5" rx="1" fill="var(--char)" opacity="0.3"/>
</svg>

<svg id="fence" viewBox="0 0 1440 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="70" fill="var(--char)"/>
  <line x1="0" y1="22" x2="1440" y2="22" stroke="rgba(244,233,211,0.1)" stroke-width="1.5"/>
  <line x1="0" y1="48" x2="1440" y2="48" stroke="rgba(244,233,211,0.1)" stroke-width="1.5"/>
</svg>

<div id="stage">
  <p class="eyebrow">Willowbank, QLD &mdash; Est. crew</p>

  <div class="badge-strip">
    <span class="badge-pill pill-orange">Country</span>
    <span class="badge-pill pill-olive">Music</span>
    <span class="badge-pill pill-blue">Festival</span>
  </div>

  <h1 class="title">
    CMC Rocks
    <span class="title-crew">Crew</span>
  </h1>
  <p class="title-qld">QLD</p>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-icon">&#9834;</span>
    <span class="divider-line rev"></span>
  </div>

  <p class="tagline">Where the boots are dusty &amp; the music's loud</p>

  <div class="construction-badge">
    <span class="dot"></span>
    Site under construction
  </div>
  <p class="sub">Something's brewing out back &mdash; check back soon.</p>
</div>

<script>
  const fence = document.getElementById('fence');
  const ns = 'http://www.w3.org/2000/svg';
  const spacing = 30;
  const count = Math.ceil(1440 / spacing) + 1;
  for (let i = 0; i < count; i++) {
    const x = i * spacing;
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', 0);
    rect.setAttribute('width', 11); rect.setAttribute('height', 58);
    rect.setAttribute('rx', 1);
    rect.setAttribute('fill', 'rgba(244,233,211,0.08)');
    fence.appendChild(rect);
    const pt = document.createElementNS(ns, 'polygon');
    pt.setAttribute('points', `${x},2 ${x+5.5},-9 ${x+11},2`);
    pt.setAttribute('fill', 'rgba(244,233,211,0.08)');
    fence.appendChild(pt);
  }
</script>
</body>
</html>
